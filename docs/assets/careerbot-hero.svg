<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">CareerBot</title>
  <desc id="desc">Bounded, auditable job application preparation through MCP, with human approval before submission.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="1030" cy="70" r="170" fill="#22d3ee" opacity=".06"/>
  <circle cx="1120" cy="350" r="230" fill="#818cf8" opacity=".08"/>
  <path d="M0 345 C260 285 410 425 690 350 S1010 300 1200 350" fill="none" stroke="#60a5fa" stroke-width="2" opacity=".14"/>

  <g transform="translate(72 74)">
    <rect width="92" height="92" rx="24" fill="#111c35" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="27" cy="29" r="7" fill="#22d3ee"/>
    <circle cx="65" cy="29" r="7" fill="#818cf8"/>
    <circle cx="46" cy="63" r="7" fill="#34d399"/>
    <path d="M33 32 L42 55 M59 32 L50 55 M34 29 H58" fill="none" stroke="#dbeafe" stroke-width="3" stroke-linecap="round"/>
    <path d="M66 62 l7 7 13-17" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="188" y="126" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="62" font-weight="800" letter-spacing="2">CareerBot</text>
  <rect x="188" y="145" width="330" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="72" y="222" fill="#dbeafe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="600">Bounded, auditable application preparation</text>
  <text x="72" y="261" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">Score fit · prepare verified artifacts · preserve evidence · hand off safely</text>

  <g transform="translate(72 306)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">
    <g><rect width="128" height="38" rx="19" fill="#17233d" stroke="#334155"/><text x="64" y="25" text-anchor="middle" fill="#bae6fd">Python 3.12</text></g>
    <g transform="translate(142)"><rect width="88" height="38" rx="19" fill="#17233d" stroke="#334155"/><text x="44" y="25" text-anchor="middle" fill="#c7d2fe">MCP</text></g>
    <g transform="translate(244)"><rect width="110" height="38" rx="19" fill="#17233d" stroke="#334155"/><text x="55" y="25" text-anchor="middle" fill="#a7f3d0">Hash logs</text></g>
    <g transform="translate(368)"><rect width="160" height="38" rx="19" fill="#17233d" stroke="#334155"/><text x="80" y="25" text-anchor="middle" fill="#fde68a">Human approval</text></g>
  </g>

  <g transform="translate(690 88)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <path d="M80 61 H170 M250 61 H340 M420 61 V165 H360" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="7 7"/>
    <g>
      <rect width="80" height="122" rx="18" fill="#111c35" stroke="#22d3ee"/>
      <circle cx="40" cy="37" r="13" fill="#164e63" stroke="#22d3ee"/>
      <text x="40" y="82" fill="#e0f2fe" text-anchor="middle" font-size="14" font-weight="700">DISCOVER</text>
    </g>
    <g transform="translate(170)">
      <rect width="80" height="122" rx="18" fill="#111c35" stroke="#818cf8"/>
      <path d="M25 37 h30 M25 46 h20" stroke="#a5b4fc" stroke-width="4" stroke-linecap="round"/>
      <text x="40" y="82" fill="#e0e7ff" text-anchor="middle" font-size="14" font-weight="700">SCORE</text>
    </g>
    <g transform="translate(340)">
      <rect width="80" height="122" rx="18" fill="#111c35" stroke="#34d399"/>
      <path d="M26 27 h28 v35 H26z M32 36 h16 M32 45 h16 M32 54 h10" fill="none" stroke="#6ee7b7" stroke-width="3" stroke-linecap="round"/>
      <text x="40" y="82" fill="#d1fae5" text-anchor="middle" font-size="14" font-weight="700">PREPARE</text>
    </g>
    <g transform="translate(280 165)">
      <rect width="160" height="78" rx="18" fill="#0f2a25" stroke="#34d399" stroke-width="2"/>
      <path d="M28 37 l9 9 18-24" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="100" y="34" fill="#d1fae5" text-anchor="middle" font-size="14" font-weight="800">APPROVAL GATE</text>
      <text x="100" y="55" fill="#86efac" text-anchor="middle" font-size="12">before external action</text>
    </g>
    <circle cx="360" cy="204" r="72" fill="#34d399" opacity=".08" filter="url(#glow)"/>
  </g>
</svg>

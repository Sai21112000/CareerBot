<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">CareerBot application workflow</title>
  <desc id="desc">Jobs supplied through permitted sources are ranked, scored, prepared, validated, snapshotted, and tracked before a policy decision routes them to an authorized connector or manual handoff.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#172033"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0 L9 3 L0 6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="620" rx="24" fill="url(#bg)"/>
  <text x="60" y="62" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="800">Application workflow</text>
  <text x="60" y="91" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Evidence moves forward; irreversible actions stop at policy gates</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <path d="M204 192 H236 M374 192 H406 M544 192 H576 M714 192 H746 M884 192 H916" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(66 135)">
      <rect width="138" height="114" rx="17" fill="#102a3a" stroke="#06b6d4" stroke-width="2"/>
      <circle cx="69" cy="31" r="13" fill="#164e63" stroke="#22d3ee"/>
      <path d="M63 31 h12 M69 25 v12" stroke="#cffafe" stroke-width="2"/>
      <text x="69" y="67" text-anchor="middle" fill="#cffafe" font-size="16" font-weight="800">1 · SUPPLY</text>
      <text x="69" y="89" text-anchor="middle" fill="#67e8f9" font-size="11">manual jobs</text>
      <text x="69" y="104" text-anchor="middle" fill="#67e8f9" font-size="11">permitted alerts</text>
    </g>
    <g transform="translate(236 135)">
      <rect width="138" height="114" rx="17" fill="#12213c" stroke="#3b82f6" stroke-width="2"/>
      <path d="M55 25 h28 M50 32 h38 M59 39 h20" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/>
      <text x="69" y="67" text-anchor="middle" fill="#dbeafe" font-size="16" font-weight="800">2 · RANK</text>
      <text x="69" y="89" text-anchor="middle" fill="#93c5fd" font-size="11">normalize</text>
      <text x="69" y="104" text-anchor="middle" fill="#93c5fd" font-size="11">deduplicate</text>
    </g>
    <g transform="translate(406 135)">
      <rect width="138" height="114" rx="17" fill="#211b45" stroke="#8b5cf6" stroke-width="2"/>
      <circle cx="69" cy="31" r="14" fill="none" stroke="#c4b5fd" stroke-width="3"/>
      <path d="M69 21 v11 l8 5" fill="none" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round"/>
      <text x="69" y="67" text-anchor="middle" fill="#ede9fe" font-size="16" font-weight="800">3 · SCORE</text>
      <text x="69" y="89" text-anchor="middle" fill="#c4b5fd" font-size="11">Grok + Master CV</text>
      <text x="69" y="104" text-anchor="middle" fill="#c4b5fd" font-size="11">sponsorship flags</text>
    </g>
    <g transform="translate(576 135)">
      <rect width="138" height="114" rx="17" fill="#12352f" stroke="#10b981" stroke-width="2"/>
      <path d="M53 18 h32 v36 H53z M59 28 h20 M59 36 h20 M59 44 h12" fill="none" stroke="#6ee7b7" stroke-width="3" stroke-linecap="round"/>
      <text x="69" y="67" text-anchor="middle" fill="#d1fae5" font-size="16" font-weight="800">4 · PREPARE</text>
      <text x="69" y="89" text-anchor="middle" fill="#6ee7b7" font-size="11">resume + letter</text>
      <text x="69" y="104" text-anchor="middle" fill="#6ee7b7" font-size="11">verified claims only</text>
    </g>
    <g transform="translate(746 135)">
      <rect width="138" height="114" rx="17" fill="#183225" stroke="#22c55e" stroke-width="2"/>
      <path d="M50 33 l10 10 24-27" fill="none" stroke="#86efac" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="69" y="67" text-anchor="middle" fill="#dcfce7" font-size="16" font-weight="800">5 · VALIDATE</text>
      <text x="69" y="89" text-anchor="middle" fill="#86efac" font-size="11">ATS + one page</text>
      <text x="69" y="104" text-anchor="middle" fill="#86efac" font-size="11">claim provenance</text>
    </g>
    <g transform="translate(916 135)">
      <rect width="218" height="114" rx="17" fill="#3b2813" stroke="#f59e0b" stroke-width="2"/>
      <path d="M38 19 h27 v34 H38z M44 28 h15 M44 36 h15 M44 44 h10" fill="none" stroke="#fcd34d" stroke-width="3" stroke-linecap="round"/>
      <text x="137" y="38" text-anchor="middle" fill="#fef3c7" font-size="16" font-weight="800">6 · SNAPSHOT</text>
      <text x="137" y="61" text-anchor="middle" fill="#fcd34d" font-size="11">SHA-256 manifest</text>
      <text x="109" y="88" text-anchor="middle" fill="#fde68a" font-size="12" font-weight="700">TRACK</text>
      <text x="109" y="104" text-anchor="middle" fill="#fcd34d" font-size="11">CSV · optional Airtable</text>
    </g>

    <path d="M1025 249 V305 H600 V338" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(425 338)">
      <path d="M175 0 L350 82 L175 164 L0 82 Z" fill="#291f38" stroke="#d946ef" stroke-width="2"/>
      <text x="175" y="69" text-anchor="middle" fill="#fae8ff" font-size="18" font-weight="800">POLICY GATE</text>
      <text x="175" y="94" text-anchor="middle" fill="#f0abfc" font-size="12">Is an authorized connector available?</text>
      <text x="175" y="112" text-anchor="middle" fill="#f0abfc" font-size="12">Any verification or restricted-platform blocker?</text>
    </g>

    <path d="M425 420 H245" fill="none" stroke="#fb7185" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="340" y="407" text-anchor="middle" fill="#fda4af" font-size="13" font-weight="700">blocked / unsupported</text>
    <g transform="translate(66 374)">
      <rect width="179" height="94" rx="16" fill="#3a1822" stroke="#f43f5e" stroke-width="2"/>
      <path d="M31 25 l18 18 M49 25 L31 43" stroke="#fb7185" stroke-width="4" stroke-linecap="round"/>
      <text x="113" y="34" text-anchor="middle" fill="#ffe4e6" font-size="16" font-weight="800">MANUAL HANDOFF</text>
      <text x="89" y="62" text-anchor="middle" fill="#fda4af" font-size="11">CAPTCHA · MFA · consent</text>
      <text x="89" y="78" text-anchor="middle" fill="#fda4af" font-size="11">restricted portal · ambiguity</text>
    </g>

    <path d="M775 420 H955" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="865" y="407" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="700">allowed + qualified</text>
    <g transform="translate(955 374)">
      <rect width="179" height="94" rx="16" fill="#12352f" stroke="#10b981" stroke-width="2"/>
      <path d="M29 38 l9 9 20-25" fill="none" stroke="#6ee7b7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="115" y="34" text-anchor="middle" fill="#d1fae5" font-size="16" font-weight="800">BYO CONNECTOR</text>
      <text x="89" y="62" text-anchor="middle" fill="#6ee7b7" font-size="11">official or authorized API</text>
      <text x="89" y="78" text-anchor="middle" fill="#6ee7b7" font-size="11">confirmation evidence required</text>
    </g>

    <rect x="66" y="542" width="1068" height="42" rx="12" fill="#151e31" stroke="#334155"/>
    <text x="600" y="568" text-anchor="middle" fill="#cbd5e1" font-size="13">
      CareerBot ships submission policy and handoff logic, not a default job-board auto-submit connector.
    </text>
  </g>
</svg>

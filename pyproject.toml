[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "careerbot"
version = "0.1.0"
description = "Bounded, auditable job application preparation and tracking through MCP"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["career", "job-search", "mcp", "ai-agents", "resume"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "email-validator>=2.2",
  "fastmcp>=2.12",
  "httpx>=0.28",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "pypdf>=6.0",
  "python-slugify>=8.0",
  "tenacity>=9.1",
  "xai-sdk>=1.4",
]

[project.optional-dependencies]
google = [
  "google-api-python-client>=2.179",
  "google-auth-oauthlib>=1.2",
]
dev = [
  "mypy>=1.17",
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "respx>=0.22",
  "ruff>=0.12",
]

[project.scripts]
careerbot = "job_agent.cli:main"
careerbot-mcp = "mcp_servers.job_agent.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/job_agent", "mcp_servers"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["job_agent", "mcp_servers"]
